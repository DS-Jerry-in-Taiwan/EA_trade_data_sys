connection:
  default_host: "mt5-server"
  fallback_hosts: ["172.21.0.2", "172.21.0.3", "172.21.0.4"]
  port: 8001
  timeout: 10

tick_service:
  enabled: true
  symbols: ["XAUUSDm", "EURUSDm", "GBPUSDm", "BTC"]
  update_interval_seconds: 60
  output_dir: "/app/service/data/ticks"

history_service:
  enabled: true
  minimum_bars:
    M5: 500
    M15: 200
    H1: 500
    D1: 200
  fetch_margin_bars: 20
  symbols:
    - name: "XAUUSDm"
      timeframes: ["M5", "M15", "H1", "D1"]
    - name: "EURUSDm"
      timeframes: ["M5", "M15", "H1", "D1"]
    - name: "GBPUSDm"
      timeframes: ["M5", "M15", "H1", "D1"]
    - name: "BTC"
      timeframes: ["M5", "M15", "H1", "D1"]
  update_interval_seconds: 60
  data_path: "/app/service/data/history"

api_gateway:
  host: "0.0.0.0"
  port: 8090
  readonly_api_key_env: "READONLY_API_KEY"

trade_query:
  default_days: 7
  max_days: 90
