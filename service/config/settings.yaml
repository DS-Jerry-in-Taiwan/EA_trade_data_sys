connection:
  # terminal attaches to the account currently selected in MT5/noVNC.
  # managed is an explicit opt-in and reads MT5_ACCOUNTS_PATH.
  mode: "terminal"
  default_host: "mt5-server"
  port: 8001
  timeout: 10

# Keep public API/cache names in the service sections below. Configure exact
# broker names here only when the catalog has ambiguous/other naming schemes.
# Each alias is checked against the connected account's catalog; missing aliases
# fail closed after reconnect/account changes. BTC infers USD, never USDT.
# Example, once verified against the broker: {"XAUUSDm": "XAU_USD"}
symbol_aliases: {}

tick_service:
  enabled: true
  symbols: ["XAUUSDm", "EURUSDm", "GBPUSDm", "BTC"]
  update_interval_seconds: 60
  socket_path: "/run/trade-data/ticks.sock"
  status_path: "/run/trade-data/tick-status.json"
  max_age_seconds: 120
  output_dir: "/app/service/data/ticks"

history_service:
  enabled: true
  status_path: "/run/trade-data/history-status.json"
  minimum_bars:
    M5: 500
    M15: 200
    H1: 500
    D1: 200
  fetch_margin_bars: 20
  symbols:
    - name: "XAUUSDm"
      timeframes: ["M5", "M15", "H1", "D1"]
    - name: "EURUSDm"
      timeframes: ["M5", "M15", "H1", "D1"]
    - name: "GBPUSDm"
      timeframes: ["M5", "M15", "H1", "D1"]
    - name: "BTC"
      timeframes: ["M5", "M15", "H1", "D1"]
  update_interval_seconds: 60
  data_path: "/app/service/data/history"

api_gateway:
  host: "0.0.0.0"
  port: 8090
  readonly_api_key_env: "READONLY_API_KEY"

trade_query:
  default_days: 7
  max_days: 90
